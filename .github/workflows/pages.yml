# Автодеплой на GitHub Pages при кожному push у main.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - id: pages
        uses: actions/configure-pages@v5

      - run: npm ci
      # Сайт живе за адресою /<назва-репо>/ — Vite має знати цей префікс.
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      # Тимчасово: дизайн до редизайну Valmora за адресою /v1/ — для порівняння. Прибрати після вибору.
      - name: Build previous design into dist/v1
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}/v1/
        run: |
          git fetch --depth=1 origin eb7b96aa4dd9c14d033fb2aee0b811937f2a05e3
          git worktree add --detach ../v1 FETCH_HEAD
          (cd ../v1 && npm ci && npm run build)
          cp -r ../v1/dist dist/v1
          sed -i 's|<head>|<head><meta name="robots" content="noindex">|' dist/v1/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

# Автодеплой на AWS S3 + CloudFront при кожному push у main.
# Налаштування — див. DEPLOY.md, крок 4.
name: Deploy to AWS

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # для входу в AWS через OIDC (без ключів доступу)
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    # Пропускається, доки в репозиторії не задано змінну S3_BUCKET (див. DEPLOY.md).
    if: vars.S3_BUCKET != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Хешовані файли (JS/CSS/шрифти) кешуються на рік, index.html — ніколи.
      - name: Upload to S3
        run: |
          aws s3 sync dist "s3://${{ vars.S3_BUCKET }}" --delete \
            --exclude index.html --cache-control "public,max-age=31536000,immutable"
          aws s3 cp dist/index.html "s3://${{ vars.S3_BUCKET }}/index.html" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/index.html" "/"
